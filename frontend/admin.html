<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Cidade em Ordem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <a href="index.html" class="logo">
            <span class="logo-icone">CO</span>
            <span>Cidade em Ordem</span>
        </a>
        <nav class="menu">
            <a href="index.html" class="botao btn-sair">Sair do Painel</a>
        </nav>
    </header>

    <main class="admin-container">
        <div class="admin-header">
            <div>
                <span class="etiqueta">PAINEL DE CONTROLE</span>
                <h1>Gestão de Solicitações</h1>
                <p>Gerencie, edite e filtre todas as ocorrências enviadas pelos cidadãos.</p>
            </div>
            <button class="botao" id="btnRecarregar">Atualizar Lista</button>
        </div>

        <div class="admin-stats">
            <div class="stat-card"><h3>Total de Solicitações</h3><p id="statTotal">0</p></div>
            <div class="stat-card"><h3>Pendentes</h3><p id="statPendentes" style="color: #b76e00;">0</p></div>
            <div class="stat-card"><h3>Resolvidas</h3><p id="statResolvidas" style="color: #216e39;">0</p></div>
        </div>

        <div class="admin-filters">
            <input type="text" id="filtroBusca" placeholder="Buscar por descrição, cidade, estado, bairro ou rua..." aria-label="Pesquisar solicitações">
            <select id="filtroStatus" aria-label="Filtrar por status">
                <option value="todos">Todos os status</option>
                <option value="pendente">Apenas Pendentes</option>
                <option value="resolvido">Apenas Resolvidos</option>
            </select>
            <select id="filtroCidade" aria-label="Filtrar por cidade">
                <option value="todas">Todas as cidades</option>
            </select>
            <select id="filtroEstado" aria-label="Filtrar por estado">
                <option value="todos">Todos os estados</option>
            </select>
            <select id="filtroPrioridade" aria-label="Filtrar por prioridade">
                <option value="todas">Todas as prioridades</option>
                <option value="0">Crítica</option>
                <option value="1">Alta</option>
                <option value="2">Média</option>
                <option value="3">Baixa</option>
            </select>
        </div>

        <div class="admin-grid" id="listaProblemas"></div>
    </main>

    <div class="modal-overlay" id="modalEdicao">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Solicitação</h2>
                <button type="button" class="btn-close" id="btnFecharModal" aria-label="Fechar">&times;</button>
            </div>
            <form id="formEditar" class="form-grid">
                <input type="hidden" id="editId">
                <div class="form-group full">
                    <label for="editDescricao">Descrição do Problema</label>
                    <textarea id="editDescricao" required></textarea>
                </div>
                <div class="form-group">
                    <label for="editTipo">Categoria</label>
                    <select id="editTipo" required>
                        <option value="0">Semáforo</option><option value="1">Buraco</option>
                        <option value="2">Iluminação pública</option><option value="3">Árvore</option>
                        <option value="4">Lixo</option><option value="5">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editPrioridade">Prioridade</label>
                    <select id="editPrioridade" required>
                        <option value="0">Crítica</option><option value="1">Alta</option>
                        <option value="2">Média</option><option value="3">Baixa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editEstado">Estado (UF)</label>
                    <input type="text" id="editEstado" maxlength="2" placeholder="Ex: SP" required>
                </div>
                <div class="form-group">
                    <label for="editCidade">Cidade</label>
                    <input type="text" id="editCidade" required>
                </div>
                <div class="form-group">
                    <label for="editBairro">Bairro</label>
                    <input type="text" id="editBairro" required>
                </div>
                <div class="form-group">
                    <label for="editRua">Rua / Avenida</label>
                    <input type="text" id="editRua" required>
                </div>
                <div class="form-group">
                    <label for="editCep">CEP (Opcional)</label>
                    <input type="text" id="editCep">
                </div>
                <div class="form-group">
                    <label for="editStatus">Status da Solicitação</label>
                    <select id="editStatus" required>
                        <option value="false">Pendente</option><option value="true">Resolvido</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="botao botao-secundario" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="botao">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <div class="imagem-ampliada-overlay" id="visualizadorImagem" role="dialog" aria-modal="true" aria-label="Imagem da ocorrência ampliada" aria-hidden="true">
        <button type="button" class="imagem-ampliada-fechar" id="fecharImagemAmpliada" aria-label="Fechar imagem">&times;</button>
        <img id="imagemAmpliada" src="" alt="">
        <p class="imagem-ampliada-legenda" id="legendaImagemAmpliada"></p>
    </div>

    <script src="administrador.js"></script>
</body>
</html>
